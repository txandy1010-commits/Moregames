<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Code Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    .btn-group {
      margin-top: 15px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-encrypt {
      background-color: #28a745;
      color: white;
    }
    .btn-decrypt {
      background-color: #007bff;
      color: white;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Secret Code Tool</h2>

  <label for="passphrase">Secret Key (Passphrase):</label>
  <input type="text" id="passphrase" value="secret123" placeholder="Set a key to scramble/unscramble">

  <label for="inputText">Input Text:</label>
  <textarea id="inputText" placeholder="Type plain text to encrypt OR scrambled code to decrypt..."></textarea>

  <div class="btn-group">
    <button class="btn-encrypt" onclick="processText(true)">Encrypt</button>
    <button class="btn-decrypt" onclick="processText(false)">Decrypt</button>
  </div>

  <label for="outputText">Result:</label>
  <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
</div>

<script>
  function processText(isEncrypt) {
    const keyStr = document.getElementById('passphrase').value || 'default';
    const input = document.getElementById('inputText').value;
    const outputField = document.getElementById('outputText');

    if (!input.trim()) {
      outputField.value = '';
      return;
    }

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const keyBytes = encoder.encode(keyStr);

    try {
      if (isEncrypt) {
        const inputBytes = encoder.encode(input);
        const resultBytes = new Uint8Array(inputBytes.length);
        for (let i = 0; i < inputBytes.length; i++) {
          resultBytes[i] = inputBytes[i] ^ keyBytes[i % keyBytes.length];
        }
        let binary = '';
        for (let i = 0; i < resultBytes.length; i++) {
          binary += String.fromCharCode(resultBytes[i]);
        }
        outputField.value = btoa(binary);
      } else {
        const binary = atob(input.trim());
        const inputBytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          inputBytes[i] = binary.charCodeAt(i);
        }
        const resultBytes = new Uint8Array(inputBytes.length);
        for (let i = 0; i < inputBytes.length; i++) {
          resultBytes[i] = inputBytes[i] ^ keyBytes[i % keyBytes.length];
        }
        outputField.value = decoder.decode(resultBytes);
      }
    } catch (e) {
      outputField.value = 'Error: Invalid encoded text or wrong secret key.';
    }
  }
</script>

</body>
</html>
