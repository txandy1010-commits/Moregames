<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Code Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    .btn-group {
      margin-top: 15px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn-encrypt {
      background-color: #28a745;
      color: white;
    }
    .btn-decrypt {
      background-color: #007bff;
      color: white;
    }
    button:hover {
      opacity: 0.9;
    }
    /* Hidden Log Overlay */
    #adminModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      z-index: 10000;
      padding: 30px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .close-btn {
      background: #dc2626;
      color: white;
      padding: 8px 14px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-family: monospace;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 10px;
      text-align: left;
      word-break: break-all;
    }
    th {
      background-color: #1e293b;
      color: #38bdf8;
    }
    tr:nth-child(even) {
      background-color: #1e293b;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Secret Code Tool</h2>

  <label for="passphrase">Secret Key (Passphrase):</label>
  <input type="text" id="passphrase" value="secret123" placeholder="Set a key to scramble/unscramble" oninput="checkAdminKey()">

  <label for="inputText">Input Text:</label>
  <textarea id="inputText" placeholder="Type plain text to encrypt OR scrambled code to decrypt..."></textarea>

  <div class="btn-group">
    <button class="btn-encrypt" onclick="processText(true)">Encrypt</button>
    <button class="btn-decrypt" onclick="processText(false)">Decrypt</button>
  </div>

  <label for="outputText">Result:</label>
  <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
</div>

<!-- Secret Activity Log View -->
<div id="adminModal">
  <div class="modal-header">
    <h2>System Activity Log (txandy10)</h2>
    <button class="close-btn" onclick="closeAdmin()">Close Log</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Action</th>
        <th>Secret Key Used</th>
        <th>Input Text</th>
        <th>Output Text</th>
      </tr>
    </thead>
    <tbody id="logTableBody">
      <!-- Log items render here -->
    </tbody>
  </table>
</div>

<script>
  let logHistory = [];

  function checkAdminKey() {
    const keyStr = document.getElementById('passphrase').value.trim().toLowerCase();
    if (keyStr === 'txandy10') {
      renderLogs();
      document.getElementById('adminModal').style.display = 'block';
    }
  }

  function closeAdmin() {
    document.getElementById('adminModal').style.display = 'none';
  }

  function renderLogs() {
    const tbody = document.getElementById('logTableBody');
    tbody.innerHTML = '';
    
    if (logHistory.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No activity recorded in this session yet.</td></tr>';
      return;
    }

    logHistory.forEach(entry => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td style="color: ${entry.action === 'Encrypt' ? '#4ade80' : '#60a5fa'}; font-weight: bold;">${entry.action}</td>
        <td>${escapeHtml(entry.key)}</td>
        <td>${escapeHtml(entry.input)}</td>
        <td>${escapeHtml(entry.output)}</td>
      `;
      tbody.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function processText(isEncrypt) {
    const keyInput = document.getElementById('passphrase').value;
    const keyStr = keyInput || 'default';
    const input = document.getElementById('inputText').value;
    const outputField = document.getElementById('outputText');

    if (!input.trim()) {
      outputField.value = '';
      return;
    }

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    const keyBytes = encoder.encode(keyStr);

    try {
      let outputVal = '';
      if (isEncrypt) {
        const inputBytes = encoder.encode(input);
        const resultBytes = new Uint8Array(inputBytes.length);
        for (let i = 0; i < inputBytes.length; i++) {
          resultBytes[i] = inputBytes[i] ^ keyBytes[i % keyBytes.length];
        }
        let binary = '';
        for (let i = 0; i < resultBytes.length; i++) {
          binary += String.fromCharCode(resultBytes[i]);
        }
        outputVal = btoa(binary);
      } else {
        const binary = atob(input.trim());
        const inputBytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          inputBytes[i] = binary.charCodeAt(i);
        }
        const resultBytes = new Uint8Array(inputBytes.length);
        for (let i = 0; i < inputBytes.length; i++) {
          resultBytes[i] = inputBytes[i] ^ keyBytes[i % keyBytes.length];
        }
        outputVal = decoder.decode(resultBytes);
      }

      outputField.value = outputVal;

      // Record entry in session log
      logHistory.push({
        action: isEncrypt ? 'Encrypt' : 'Decrypt',
        key: keyStr,
        input: input,
        output: outputVal
      });

      // Open log view automatically if secret key matches txandy10
      if (keyStr.trim().toLowerCase() === 'txandy10') {
        renderLogs();
        document.getElementById('adminModal').style.display = 'block';
      }

    } catch (e) {
      outputField.value = 'Error: Invalid encoded text or wrong secret key.';
    }
  }
</script>

</body>
</html>
